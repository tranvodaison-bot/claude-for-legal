# Sổ văn bản theo thời gian (trọng tâm 2021-2026, kèm văn bản gốc trước 2021 làm mốc chuyển tiếp).
#
# level  : primary   = đã đối chiếu văn bản gốc (Công báo)
#          secondary = tra cứu trang thứ cấp ngày 03/10/2026, chưa đọc văn bản gốc
#          recall    = theo hiểu biết của người lập, CHƯA tra cứu
# role   : chinh (văn bản chính của lĩnh vực) | sua_doi | hop_nhat (VBHN - lớp hiển thị, không phải nguồn gốc)
# het_hieu_luc: để trống nếu suy ra được từ văn bản thay thế (`replaces`).
# Chỉ kết luận ở mức primary mới được tạo phát hiện mức ĐỎ.
version: 1
