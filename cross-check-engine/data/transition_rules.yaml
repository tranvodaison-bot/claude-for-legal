# Quy tắc chuyển tiếp: khi một văn bản DỰ ÁN ký sau ngày văn bản pháp luật cũ hết hiệu lực
# mà vẫn viện dẫn văn bản cũ, kiểm tra có thuộc trường hợp được tiếp tục áp dụng văn bản cũ không.
#
# allow_old_if: chỉ cần MỘT điều kiện đúng. Mỗi điều kiện so một "ngày quyết định" với ranh giới
#   (= ngày hiệu lực của văn bản mới). date_ref tra theo thứ tự: trường của văn bản dự án ->
#   project.key_dates -> suy ra (ngay_ky_hop_dong từ `hop_dong`, ngay_phe_duyet_du_an từ steps).
#
# TOÀN BỘ quy tắc dưới đây là KHUNG GIẢ THUYẾT theo mẫu chuyển tiếp thường gặp, verified: false,
# chưa có số điều/khoản. Phải bóc điều khoản chuyển tiếp thật của từng văn bản mới để xác nhận
# hoặc sửa điều kiện. Văn bản không có quy tắc ở đây -> engine báo "chưa có quy tắc chuyển tiếp".
